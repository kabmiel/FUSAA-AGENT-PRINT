[project]
name = "fusaa-print-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.2",
  "pydantic-settings>=2.5", "PyJWT>=2.9", "pwdlib[argon2]>=0.2", "python-multipart>=0.0.12",
  "pillow>=10.4", "pypdf>=5.0", "pymupdf>=1.24", "email-validator>=2.2", "alembic>=1.13", "pywebpush>=2.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "alembic>=1.13"]

[tool.pytest.ini_options]
testpaths = ["../tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
