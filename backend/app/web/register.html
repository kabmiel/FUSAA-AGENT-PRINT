<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer mon accès FUSAA</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#eaf6ff;background:#07111f}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:radial-gradient(circle at 75% -10%,#1969f044,transparent 28rem),#07111f}.card{width:min(460px,calc(100vw - 28px));padding:28px;border:1px solid #41dfca55;border-radius:24px;background:linear-gradient(145deg,#123048,#071522);box-shadow:0 28px 80px #0009}.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#21d7bd,#237bf0);font-weight:900;font-size:1.25rem}.eyebrow{margin:17px 0 5px;color:#42e4ca;font-size:.72rem;font-weight:850;letter-spacing:.12em}h1{margin:0;font-size:1.7rem}p{color:#a5bdcf;line-height:1.5}label{display:block;margin-top:14px;color:#b7cad9;font-size:.78rem;font-weight:750}input{width:100%;margin-top:6px;padding:12px;color:#eff9ff;background:#071725;border:1px solid #31536d;border-radius:11px;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;color:#fff;background:linear-gradient(135deg,#1cbba8,#187deb);font:inherit;font-weight:850;cursor:pointer}.status{min-height:22px;color:#76e5d1;font-size:.86rem}</style></head><body><main class="card"><div class="logo">F</div><p class="eyebrow">INVITATION FUSAA</p><h1>Activez votre accès</h1><p>Créez votre mot de passe. Votre rôle dans l’atelier sera activé automatiquement.</p><form id="registerForm"><label>NOM ET PRÉNOM<input id="name" required minlength="1" autocomplete="name"></label><label>ADRESSE E-MAIL<input id="email" required type="email" autocomplete="email"></label><label>MOT DE PASSE <small>(12 caractères minimum)</small><input id="password" required type="password" minlength="12" autocomplete="new-password"></label><button>Activer mon accès</button><p id="status" class="status" role="status"></p></form></main><script>const p=new URLSearchParams(location.search);email.value=p.get('email')||'';registerForm.onsubmit=async e=>{e.preventDefault();status.textContent='Activation…';try{const r=await fetch('/api/v1/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value,display_name:name.value.trim()})}),d=await r.json();if(!r.ok)throw Error(d.detail||'Activation impossible.');localStorage.token=d.access_token;status.textContent='Accès activé. Ouverture de FUSAA…';location.assign('/admin')}catch(error){status.textContent=error.message}};</script></body></html>
