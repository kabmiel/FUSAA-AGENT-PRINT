<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Activer mon accès FUSAA</title><link rel="stylesheet" href="/auth-links.css"><script src="/auth-links.js" defer></script></head>
<body data-auth-purpose="ACTIVATE"><main class="card"><div class="logo">F</div><p class="eyebrow">ACCÈS FUSAA</p><h1>Activez votre accès</h1><p id="authDescription">Créez votre mot de passe. Votre rôle dans l’atelier sera conservé.</p>
<p id="authStatus" class="status" role="status" aria-live="polite"></p>
<form id="authLinkForm"><label for="authName">NOM ET PRÉNOM</label><input id="authName" required minlength="1" maxlength="120" autocomplete="name">
<label for="authEmail">ADRESSE E-MAIL</label><input id="authEmail" required type="email" autocomplete="username">
<label for="authPassword">MOT DE PASSE <small>(4 caractères minimum, sans symboles obligatoires)</small></label><input id="authPassword" required type="password" minlength="4" maxlength="128" autocomplete="new-password">
<label for="authConfirm">CONFIRMER LE MOT DE PASSE</label><input id="authConfirm" required type="password" minlength="4" maxlength="128" autocomplete="new-password"><button id="authSubmit" type="submit">Activer mon accès</button></form>
<nav class="auth-links"><a href="/admin">Retour à la connexion</a><a href="/boutique">← Retour à la boutique</a></nav></main></body></html>
