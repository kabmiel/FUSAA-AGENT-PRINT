<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Boutique FUSAA</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#eaf5ff;background:#07111f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 86% -10%,#2876f544,transparent 30rem),#07111f}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:15px max(20px,calc((100% - 1180px)/2));background:#07111fec;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff13}.brand{color:#fff;text-decoration:none;font-weight:900;letter-spacing:.08em}.brand i{display:inline-grid;place-items:center;margin-right:8px;width:29px;height:29px;border-radius:9px;font-style:normal;background:linear-gradient(135deg,#21d9bd,#2176ed)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:11px 14px;color:#fff;background:linear-gradient(135deg,#1ec4af,#217eec);font-weight:800}.cart{background:#ffffff0e;border:1px solid #ffffff1b}.wrap{max-width:1180px;margin:auto;padding:34px 20px 70px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:26px}.eyebrow{font-size:.72rem;letter-spacing:.14em;color:#36e1c7;font-weight:900}.hero h1{font-size:clamp(2rem,5vw,3.5rem);letter-spacing:-.07em;margin:7px 0}.muted{color:#9cb5c9}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:22px}.filters input,.filters select{padding:11px 12px;border-radius:11px;border:1px solid #31546c;color:#eaf5ff;background:#0a1a2a}.filters input{min-width:230px;flex:1}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.product{overflow:hidden;border:1px solid #ffffff14;border-radius:19px;background:linear-gradient(145deg,#10273ddb,#0a1725ee);transition:transform .18s,border .18s}.product:hover{transform:translateY(-4px);border-color:#42dec8}.image{display:grid;place-items:center;height:170px;background:#102a3d;color:#83a8bd;font-size:.85rem}.image img{width:100%;height:100%;object-fit:cover}.info{padding:15px}.tag{font-size:.69rem;color:#63ebd4;font-weight:800;letter-spacing:.08em}.product h2{font-size:1rem;margin:7px 0}.price{font-size:1.22rem;font-weight:900;color:#fff}.old{margin-left:7px;color:#829aaa;text-decoration:line-through;font-size:.8rem}.stock{font-size:.78rem;color:#a8c0d0}.product button{width:100%;margin-top:12px}.empty{padding:30px;border:1px dashed #ffffff24;border-radius:16px;color:#a8c0d0;text-align:center}.dialog{width:min(620px,calc(100vw - 24px));border:1px solid #61ead48a;border-radius:24px;padding:22px;color:#eaf5ff;background:#0d2438f5;box-shadow:0 30px 90px #000a}.dialog::backdrop{background:#03101a8c;backdrop-filter:blur(7px)}.dialog h2{margin:0 0 10px}.close{float:right;background:#ffffff0e}.line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff11}.total{font-size:1.25rem;font-weight:900;margin:18px 0}.field{display:grid;gap:5px;margin:10px 0;color:#b6cad9;font-size:.78rem;font-weight:750}.field input,.field textarea,.field select{padding:11px;border:1px solid #31546c;border-radius:10px;background:#071725;color:#eaf5ff}.field textarea{min-height:70px}.notice{color:#8eabba;font-size:.82rem}.hidden{display:none!important}@media(max-width:760px){.products{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{align-items:start;flex-direction:column}}@media(max-width:470px){.products{grid-template-columns:1fr}.top{padding:13px}.wrap{padding:25px 14px}}</style></head><body><header class="top"><a class="brand" href="/"><i>F</i>BOUTIQUE FUSAA</a><button id="cartButton" class="cart">Panier <span id="cartCount">0</span></button></header><main class="wrap"><section class="hero"><div><span class="eyebrow">TECHNOLOGIE · PRIX EN FCFA</span><h1>La boutique FUSAA.</h1><p class="muted">Produits disponibles auprès de FUSAA INFORMATIQUE.</p></div></section><section class="filters"><input id="search" placeholder="Rechercher un produit"><select id="category"><option value="">Toutes les catégories</option></select></section><section id="products" class="products" aria-live="polite"></section></main><dialog id="cartDialog" class="dialog"><button class="close" onclick="cartDialog.close()">×</button><span class="eyebrow">VOTRE COMMANDE</span><h2>Panier Boutique FUSAA</h2><div id="cartLines"></div><div id="cartTotal" class="total"></div><form id="checkout"><label class="field">NOM ET PRÉNOM<input id="customerName" required minlength="2"></label><label class="field">NUMÉRO DE TÉLÉPHONE<input id="customerPhone" required minlength="5" type="tel"></label><label class="field">ADRESSE / POINT DE LIVRAISON<textarea id="address"></textarea></label><label class="field">MODE DE PAIEMENT<select id="payment"><option value="À confirmer">À confirmer avec FUSAA</option><option>Espèces</option><option>Mobile Money</option></select></label><p class="notice">La disponibilité et le paiement sont confirmés par FUSAA avant livraison.</p><button id="orderButton">Envoyer la commande</button></form></dialog><dialog id="successDialog" class="dialog"><button class="close" onclick="successDialog.close()">×</button><span class="eyebrow">COMMANDE ENREGISTRÉE</span><h2 id="successTitle"></h2><p id="successText" class="muted"></p></dialog><script src="/shop.js"></script></body></html>
