services:
  - type: web
    name: fusaa-service
    runtime: python
    rootDir: backend
    buildCommand: pip install .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /readyz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_DIR
        value: /tmp/fusaa-storage
      - key: LOG_LEVEL
        value: INFO
      - key: ACCESS_TOKEN_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: SINGLE_WORKSHOP_ID
        value: bf806921-830a-4ce2-b792-e5ceb0f24fef
      - key: SINGLE_WORKSHOP_NAME
        value: FUSAA INFORMATIQUE
      - key: AI_PROVIDER
        value: deterministic
      - key: OLLAMA_BASE_URL
        value: ""
      - key: OLLAMA_MODEL
        value: ""
      - key: VAPID_PUBLIC_KEY
        value: ""
      - key: VAPID_PRIVATE_KEY
        value: ""
      - key: VAPID_CLAIM_EMAIL
        sync: false
      - key: META_WHATSAPP_APP_SECRET
        value: ""
      - key: MAX_UPLOAD_BYTES
        value: "104857600"
