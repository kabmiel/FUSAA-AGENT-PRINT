<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>FUSAA Service</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#ecf7ff;background:#07111f}body{min-height:100vh;margin:0;display:grid;place-items:center;background:radial-gradient(circle at 75% 10%,#1674c955,transparent 36%),radial-gradient(circle at 20% 90%,#17cdb355,transparent 38%),#07111f}.card{width:min(80vw,340px);padding:32px;border:1px solid #ffffff1c;border-radius:28px;background:#0c1d31d9;box-shadow:0 25px 80px #0008;text-align:center}.logo{width:64px;height:64px;margin:auto;display:grid;place-items:center;border-radius:20px;background:linear-gradient(135deg,#21d4bc,#247ef0);font-size:29px;font-weight:900;box-shadow:0 0 36px #22cfc477}h1{margin:17px 0 6px;font-size:25px;letter-spacing:-.04em}p{margin:0;color:#9eb5ca;font-size:14px}.pulse{width:44px;height:4px;margin:24px auto 0;border-radius:9px;background:#24d5bd;animation:pulse 1.1s ease-in-out infinite}@keyframes pulse{50%{transform:scaleX(.45);opacity:.45}}</style></head><body><main class="card"><div class="logo">F</div><h1>FUSAA Service</h1><p>Connexion à votre atelier…</p><div class="pulse"></div></main></body></html>
